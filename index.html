<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="hearts-background">
            <!-- Hearts will be generated by JavaScript -->
        </div>
        
        <div class="content">
            <h1 class="title">
                <span class="letter">H</span>
                <span class="letter">a</span>
                <span class="letter">p</span>
                <span class="letter">p</span>
                <span class="letter">y</span>
                <span class="letter">&nbsp;</span>
                <span class="letter">V</span>
                <span class="letter">a</span>
                <span class="letter">l</span>
                <span class="letter">e</span>
                <span class="letter">n</span>
                <span class="letter">t</span>
                <span class="letter">i</span>
                <span class="letter">n</span>
                <span class="letter">e</span>
                <span class="letter">'</span>
                <span class="letter">s</span>
                <span class="letter">&nbsp;</span>
                <span class="letter">D</span>
                <span class="letter">a</span>
                <span class="letter">y</span>
            </h1>
            
            <div class="message">
                <p class="fade-in">You are loved ❤️</p>
            </div>
            
            <div class="heart-container">
                <div class="big-heart">❤️</div>
            </div>
            
            <button class="btn" id="surpriseBtn">Click for a Surprise!</button>
            
            <div class="love-note" id="loveNote">
                <p>Every day with you is a blessing. You make my heart smile! 💕</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
